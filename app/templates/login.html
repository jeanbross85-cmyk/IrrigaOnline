{% extends "base.html" %}{% block content %}<div class="login-wrap"><h1>Acesso ao Agente de Irrigação</h1><p>Entre com sua conta individual para consultar o histórico compartilhado.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Usuário</label><input name="username" autocomplete="username" required><label>Senha</label><input name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button></form><p class="note">As contas devem ser criadas pelo responsável pela implantação. Não há conta padrão embutida.</p></div>{% endblock %}
